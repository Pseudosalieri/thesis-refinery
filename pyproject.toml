[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "thesis-refinery"
version = "0.1.0"
description = "Turn an already-written Word thesis into a reproducible build artifact, guarded by assertions instead of eyeballs."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "thesis-refinery contributors" }]
keywords = [
    "thesis",
    "dissertation",
    "docx",
    "python-docx",
    "quarto",
    "pandoc",
    "formatting",
    "verification",
    "reproducible-build",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Text Processing :: Markup :: XML",
]

dependencies = [
    "python-docx>=1.1",
    "lxml>=5.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Domain profile: numeric spectra appendices, software-reported energy terms, etc.
chemistry = ["openpyxl>=3.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
thesis-refinery = "thesis_refinery.cli:main"

[project.urls]
Documentation = "https://github.com/OWNER/thesis-refinery#readme"
Source = "https://github.com/OWNER/thesis-refinery"
Issues = "https://github.com/OWNER/thesis-refinery/issues"

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/thesis_refinery"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "examples/",
    "tools/",
    "docs/",
    "README.md",
    "README.zh-CN.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "tools", "examples"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "RUF",
]
ignore = [
    "E501", # line length is enforced by the formatter, not the linter
]
# RUF001/RUF002/RUF003 flag characters that *look* like ASCII but are not. In a
# project whose templates and documentation are partly Chinese, the full-width
# forms are the correct characters, not confusables. Listed explicitly rather
# than switching the rule off, so that a genuinely accidental look-alike is
# still caught.
allowed-confusables = [
    "，", "。", "、", "；", "：", "？", "！",
    "（", "）", "《", "》", "「", "」", "【", "】",
    "“", "”", "‘", "’", "—", "…", "·",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `pythonpath` makes the test suite work without any install step at all, which
# matters on machines where an editable install is defeated by a non-ASCII
# checkout path — see docs/troubleshooting.md.
pythonpath = ["src", "tools"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: end-to-end tests that shell out to Quarto (deselect with '-m \"not slow\"')",
]
filterwarnings = ["error"]
