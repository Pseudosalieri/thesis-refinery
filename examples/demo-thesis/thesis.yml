# =============================================================================
# demo-thesis — a project configuration
#
# Everything here is synthetic. The thesis this builds does not exist, does not
# describe real work, and cites references that are obviously placeholders. It
# exists so that `thesis-refinery build` has something to run on, and so that a
# new user has a working example to copy rather than a blank page.
#
# Copy this file to your own project and edit it. The three sections that need
# real values are `identity`, `style.header_footer`, and `checks`.
# =============================================================================

project:
  thesis_dir: manuscript
  chapters_dir: manuscript/chapters
  output_dir: manuscript/_outputs

# Strings that must, and must not, appear in the front matter.
#
# Empty by default here, which makes the identity check *skip*. That is
# deliberate: this project ships no default identity, because a checker with a
# built-in fallback verifies whatever the fallback describes. Fill these in with
# your own cover's wording, once you have a cover.
identity:
  required: []
  forbidden: []

# Formatting facts. Anything not named here uses the neutral default from
# thesis_refinery.style. Transcribe your institution's requirements in.
style:
  page:
    width_mm: 210
    height_mm: 297
  margins:
    top_mm: 25
    bottom_mm: 25
    body_side_mm: 20
    front_matter_side_mm: 25
    header_distance_mm: 12.7
    footer_distance_mm: 12.7
  body:
    first_line_indent_twips: 480
    line_spacing_twips: 360
  header_footer:
    # A default, not a fact. Every institution specifies its own wording, and
    # printing the wrong one on every page of a submitted thesis is worse than
    # printing nothing -- so this is the one value you must set yourself.
    odd_page_text: "示例学位论文"
    footer_size_pt: 9

# Expected counts. `auto` means "derive it from the document under test", which
# is the default because a hard-coded count rots silently. Pin a number only
# when you actually need to pin it, and expect to update it when content
# changes.
checks:
  expect_captions: auto
  expect_body_paragraphs: auto
  expect_reference_entries: auto
  expect_sections: auto
  expect_drawings: auto

# Domain profiles. Empty means the core pipeline only, with no optional
# dependencies. The demo does not use one.
profiles: []

# The style template the renderer reads. Generated by
# `python tools/make_reference_docx.py` rather than copied from anyone.
reference_docx: manuscript/reference.docx
